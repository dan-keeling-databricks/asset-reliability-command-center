bundle:
  name: asset-reliability-command-center
  databricks_cli_version: ">=1.17.0"
  deployment:
    lock:
      enabled: true

variables:
  catalog:
    description: Unity Catalog catalog hosting the project schema.
    default: classic_stable_realtime_demos_catalog
  schema:
    description: Unity Catalog schema for checkpoints and governed assets.
    default: asset_reliability_command_center
  volume:
    description: Managed volume for streaming checkpoints.
    default: runtime
  warehouse_id:
    description: Serverless SQL warehouse used for setup and policy functions.
    default: 2162b643ec0f802a
  kafka_bootstrap:
    default: 63.186.81.193:443
  kafka_topic:
    default: asset-reliability-pump-telemetry
  telemetry_pipeline_node_type:
    description: Classic-compute worker type for governed telemetry ingestion.
    default: i3.xlarge
  sandbox_capacity:
    description: Maximum number of concurrently allocated personal telemetry sandboxes.
    default: 32
  telemetry_samples_per_second:
    description: Spark Rate samples generated per pump and personal sandbox each second.
    default: 2
  telemetry_source_partitions:
    description: Fixed Spark Rate partition count used for RTM slot sizing.
    default: 4
  app_access_group:
    description: Existing workspace group admitted to the App; it does not assign product roles.
    default: users
  telemetry_analysis_group:
    description: Optional production-reference group for governed history and Genie access.
    default: asset-reliability-command-center-operator
  app_service_principal_client_id:
    description: Existing Databricks App service-principal application ID used by workloads.
    default: bd5178cb-8774-4d77-bc63-b4f491716d0b
  genie_parent_path:
    description: Workspace folder in which the bundle manages the Genie space.
    default: /Shared
  lakebase_project_id:
    default: asset-reliability-command-center
  lakebase_endpoint_path:
    description: Full Lakebase endpoint resource path used by the Databricks SDK.
    default: projects/asset-reliability-command-center/branches/production/endpoints/primary
  lakebase_schema:
    default: asset_reliability
  foundation_model:
    description: Unity Catalog Foundation Model API model routed by the agent Model Service.
    default: system.ai.databricks-claude-sonnet-4-5
  model_service_name:
    description: Unity Catalog Model Service used by the LangGraph agent for inference.
    default: asset_reliability_agent_model
  mlflow_experiment_name:
    description: Absolute workspace path for LangGraph traces and GenAI evaluation runs.
    default: /Shared/asset-reliability-command-centre-agent
  mlflow_trace_table_prefix:
    description: Stable prefix for the Unity Catalog tables that persist MLflow traces.
    default: asset_reliability_agent

sync:
  include:
    - .artifacts/app/**
    - backend/**
    - frontend/dist/**
    - skills/**
    - src/**
    - sql/**
    - app.yaml
    - pyproject.toml
    - uv.lock
    - requirements.txt
    - .build-info.json
  exclude:
    - .venv/**
    - "**/__pycache__/**"
    - "**/*.pyc"
    - frontend/node_modules/**
    - "frontend/*.tsbuildinfo"

resources:
  cluster_policies:
    asset_reliability_workloads:
      name: Asset Reliability — dedicated classic workload policy
      description: Least-privilege classic compute shapes for Rate RTM and reference workloads.
      max_clusters_per_user: 6
      definition: |
        {
          "node_type_id": {
            "type": "fixed",
            "value": "i3.xlarge"
          },
          "num_workers": {
            "type": "range",
            "minValue": 0,
            "maxValue": 1,
            "defaultValue": 1
          },
          "spark_version": {
            "type": "regex",
            "pattern": "^(17\\.3\\.x-scala2\\.13|19\\.x-scala2\\.13|dlt:.*)$",
            "isOptional": true
          },
          "spark_conf.spark.databricks.cluster.profile": {
            "type": "allowlist",
            "values": ["singleNode"],
            "isOptional": true
          },
          "spark_conf.spark.databricks.streaming.realTimeMode.enabled": {
            "type": "allowlist",
            "values": ["true"],
            "isOptional": true
          },
          "spark_conf.spark.sql.shuffle.partitions": {
            "type": "allowlist",
            "values": ["4"],
            "isOptional": true
          },
          "runtime_engine": {
            "type": "allowlist",
            "values": ["STANDARD", "PHOTON"],
            "isOptional": true
          },
          "enable_elastic_disk": {
            "type": "fixed",
            "value": true
          },
          "aws_attributes.availability": {
            "type": "fixed",
            "value": "ON_DEMAND"
          },
          "instance_pool_id": {
            "type": "forbidden",
            "hidden": true
          },
          "driver_instance_pool_id": {
            "type": "forbidden",
            "hidden": true
          }
        }
      permissions:
        - level: CAN_USE
          service_principal_name: ${var.app_service_principal_client_id}

  volumes:
    runtime_volume:
      name: ${var.volume}
      catalog_name: ${var.catalog}
      schema_name: ${var.schema}
      volume_type: MANAGED
      comment: Streaming checkpoints and runtime artifacts for Asset Reliability

  postgres_projects:
    asset_reliability_postgres:
      project_id: ${var.lakebase_project_id}
      display_name: Asset Reliability Command Center
      pg_version: 17
      default_endpoint_settings:
        autoscaling_limit_min_cu: 0.5
        autoscaling_limit_max_cu: 1
        no_suspension: true
      custom_tags:
        - key: demo
          value: asset-reliability-command-center
        - key: environment
          value: world-tour-demo

  jobs:
    setup_unity_governance:
      name: Asset Reliability — create Unity Gateway policy function
      tasks:
        - task_key: create_policy_function
          sql_task:
            file:
              path: ./sql/setup_demo.sql
            warehouse_id: ${var.warehouse_id}

    setup_telemetry_access:
      name: Asset Reliability — grant curated telemetry access
      description: Idempotently grants the existing App group access only to the Genie view.
      tasks:
        - task_key: grant_curated_view
          sql_task:
            file:
              path: ./sql/grant_telemetry_history.sql
            warehouse_id: ${var.warehouse_id}
            parameters:
              catalog_name: ${var.catalog}
              schema_fqn: ${var.catalog}.${var.schema}
              view_fqn: ${var.catalog}.${var.schema}.pump_telemetry_history

    setup_runtime_principal_access:
      name: Asset Reliability — grant workload identity access
      description: Grants the existing App service principal only the UC privileges workloads need.
      tasks:
        - task_key: grant_runtime_principal
          sql_task:
            file:
              path: ./sql/grant_runtime_principal.sql
            warehouse_id: ${var.warehouse_id}
            parameters:
              catalog_name: ${var.catalog}
              schema_fqn: ${var.catalog}.${var.schema}
              volume_fqn: ${var.catalog}.${var.schema}.${var.volume}

    setup_agent_observability_access:
      name: Asset Reliability — grant agent observability access
      description: Grants trace-table write access to the App identity and read access to App users.
      tasks:
        - task_key: grant_agent_observability
          sql_task:
            file:
              path: ./sql/grant_agent_observability.sql
            warehouse_id: ${var.warehouse_id}
            parameters:
              catalog_name: ${var.catalog}
              schema_name: ${var.schema}
              table_prefix: ${var.mlflow_trace_table_prefix}
              app_service_principal: ${var.app_service_principal_client_id}
              app_access_group: ${var.app_access_group}

    migrate_lakebase_schema:
      name: Asset Reliability — migrate App-owned Lakebase schema
      description: Applies idempotent Lakebase DDL as the existing App service principal.
      run_as:
        service_principal_name: ${var.app_service_principal_client_id}
      job_clusters:
        - job_cluster_key: migration_cluster
          new_cluster:
            policy_id: ${resources.cluster_policies.asset_reliability_workloads.id}
            spark_version: 17.3.x-scala2.13
            node_type_id: i3.xlarge
            num_workers: 0
            data_security_mode: SINGLE_USER
            enable_elastic_disk: true
            spark_conf:
              spark.master: local[*, 4]
              spark.databricks.cluster.profile: singleNode
            custom_tags:
              ResourceClass: SingleNode
              Workload: asset-reliability-lakebase-migration
            aws_attributes:
              availability: ON_DEMAND
      tasks:
        - task_key: apply_schema
          job_cluster_key: migration_cluster
          notebook_task:
            notebook_path: ./src/migrations/apply_lakebase_schema.py
            base_parameters:
              lakebase_endpoint: ${var.lakebase_endpoint_path}
              lakebase_database: databricks_postgres
              lakebase_schema: ${var.lakebase_schema}
              sandbox_capacity: ${var.sandbox_capacity}
          libraries:
            - pypi:
                package: databricks-sdk==0.142.0
            - pypi:
                package: psycopg[binary]==3.2.10

    telemetry_producer:
      name: Asset Reliability — continuous pump telemetry producer
      description: Paused rollback-only Kafka producer; Spark Rate is the active demo source.
      continuous:
        pause_status: PAUSED
      max_concurrent_runs: 1
      run_as:
        service_principal_name: ${var.app_service_principal_client_id}
      job_clusters:
        - job_cluster_key: producer_cluster
          new_cluster:
            policy_id: ${resources.cluster_policies.asset_reliability_workloads.id}
            spark_version: 17.3.x-scala2.13
            node_type_id: i3.xlarge
            num_workers: 0
            data_security_mode: SINGLE_USER
            spark_conf:
              spark.master: local[*, 4]
              spark.databricks.cluster.profile: singleNode
            custom_tags:
              ResourceClass: SingleNode
              Workload: asset-reliability-producer
            aws_attributes:
              availability: ON_DEMAND
      tasks:
        - task_key: produce_telemetry
          job_cluster_key: producer_cluster
          notebook_task:
            notebook_path: ./src/producer/pump_telemetry_producer.py
            base_parameters:
              kafka_bootstrap: ${var.kafka_bootstrap}
              kafka_topic: ${var.kafka_topic}
              lakebase_endpoint: ${var.lakebase_endpoint_path}
              lakebase_database: databricks_postgres
              lakebase_schema: ${var.lakebase_schema}
              rate_hz: "2"
              run_seconds: "0"
          libraries:
            - pypi:
                package: databricks-sdk==0.142.0
            - pypi:
                package: kafka-python-ng==2.2.3
            - pypi:
                package: psycopg[binary]==3.2.10

    telemetry_rtm:
      name: Asset Reliability — Spark Rate to Lakebase RTM
      description: Shared deterministic personal-sandbox telemetry generator and Lakebase sink.
      continuous:
        pause_status: UNPAUSED
      max_concurrent_runs: 1
      run_as:
        service_principal_name: ${var.app_service_principal_client_id}
      job_clusters:
        - job_cluster_key: rtm_cluster
          new_cluster:
            policy_id: ${resources.cluster_policies.asset_reliability_workloads.id}
            spark_version: 19.x-scala2.13
            node_type_id: i3.xlarge
            num_workers: 1
            data_security_mode: SINGLE_USER
            runtime_engine: STANDARD
            enable_elastic_disk: true
            spark_conf:
              spark.databricks.streaming.realTimeMode.enabled: "true"
              spark.sql.shuffle.partitions: "4"
            custom_tags:
              Workload: asset-reliability-rtm
            aws_attributes:
              availability: ON_DEMAND
      tasks:
        - task_key: ingest_pump_telemetry
          job_cluster_key: rtm_cluster
          notebook_task:
            notebook_path: ./src/streaming/rate_to_lakebase_rtm.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              volume: ${var.volume}
              sandbox_capacity: ${var.sandbox_capacity}
              samples_per_second: ${var.telemetry_samples_per_second}
              source_partitions: ${var.telemetry_source_partitions}
              lakebase_endpoint: ${var.lakebase_endpoint_path}
              lakebase_database: databricks_postgres
              lakebase_table: ${var.lakebase_schema}.telemetry_events
              # Demo-specific RTM epoch: the native Lakebase sink becomes visible at epoch
              # boundaries in this workspace, so ten seconds keeps the live UI responsive.
              trigger_interval: 10 seconds
              diagnostic_seconds: "0"

    governed_telemetry_history_continuous:
      name: Asset Reliability — continuous governed telemetry history
      description: Paused production-reference Kafka-to-Unity-Catalog pipeline runner.
      continuous:
        pause_status: PAUSED
      max_concurrent_runs: 1
      run_as:
        service_principal_name: ${var.app_service_principal_client_id}
      tasks:
        - task_key: run_governed_telemetry_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.governed_telemetry_history.id}
            full_refresh: false

    evaluate_agent_traces:
      name: Asset Reliability — evaluate governed agent traces
      description: Evaluates genuine P-202, P-207 and P-204 LangGraph traces against known outcomes.
      run_as:
        service_principal_name: ${var.app_service_principal_client_id}
      job_clusters:
        - job_cluster_key: evaluation_cluster
          new_cluster:
            policy_id: ${resources.cluster_policies.asset_reliability_workloads.id}
            spark_version: 17.3.x-scala2.13
            node_type_id: i3.xlarge
            num_workers: 0
            data_security_mode: SINGLE_USER
            enable_elastic_disk: true
            spark_conf:
              spark.master: local[*, 4]
              spark.databricks.cluster.profile: singleNode
            custom_tags:
              ResourceClass: SingleNode
              Workload: asset-reliability-agent-evaluation
            aws_attributes:
              availability: ON_DEMAND
      tasks:
        - task_key: evaluate_known_outcomes
          job_cluster_key: evaluation_cluster
          notebook_task:
            notebook_path: ./src/evaluation/evaluate_agent_traces.py
            base_parameters:
              experiment_id: ${resources.experiments.agent_observability.id}
              sql_warehouse_id: ${var.warehouse_id}
              trace_lookback_hours: "168"
          libraries:
            - pypi:
                package: mlflow[databricks]>=3.18,<4

  pipelines:
    governed_telemetry_history:
      name: Asset Reliability — governed telemetry history
      run_as:
        service_principal_name: ${var.app_service_principal_client_id}
      catalog: ${var.catalog}
      schema: ${var.schema}
      edition: ADVANCED
      channel: CURRENT
      serverless: false
      photon: true
      cascade_on_destroy: false
      libraries:
        - notebook:
            path: ./src/pipelines/governed_telemetry_history.sql
      configuration:
        kafka_bootstrap: ${var.kafka_bootstrap}
        kafka_topic: ${var.kafka_topic}
        kafka_starting_offsets: latest
      clusters:
        - label: default
          policy_id: ${resources.cluster_policies.asset_reliability_workloads.id}
          node_type_id: ${var.telemetry_pipeline_node_type}
          num_workers: 1
          aws_attributes:
            availability: ON_DEMAND
          custom_tags:
            Workload: asset-reliability-governed-history
      permissions:
        - level: CAN_VIEW
          group_name: ${var.telemetry_analysis_group}
        - level: CAN_RUN
          service_principal_name: ${var.app_service_principal_client_id}

  genie_spaces:
    fleet_telemetry_analyst:
      title: Asset Reliability — Fleet Telemetry Analyst
      description: Natural-language analysis of continuous governed pump telemetry history.
      warehouse_id: ${var.warehouse_id}
      parent_path: ${var.genie_parent_path}
      file_path: ./genie/fleet_telemetry_analyst.geniespace.json
      permissions:
        - level: CAN_RUN
          group_name: ${var.telemetry_analysis_group}

  model_services:
    agent_model:
      parent: schemas/${var.catalog}.${var.schema}
      model_service_id: ${var.model_service_name}
      comment: Governed Foundation Model API route for the Asset Reliability LangGraph agent.
      config:
        routing:
          destinations:
            - name: primary
              destination_type: DESTINATION_TYPE_PAY_PER_TOKEN_FOUNDATION_MODEL
              pay_per_token_config:
                model: models/${var.foundation_model}
              traffic_percentage: 100

  experiments:
    agent_observability:
      name: ${var.mlflow_experiment_name}
      trace_location:
        uc_trace_location:
          catalog: ${var.catalog}
          schema: ${var.schema}
          table_prefix: ${var.mlflow_trace_table_prefix}
      tags:
        - key: application
          value: asset-reliability-command-centre
        - key: purpose
          value: langgraph-tracing-and-genai-evaluation
      permissions:
        - level: CAN_EDIT
          service_principal_name: ${resources.apps.command_center.service_principal_client_id}
        - level: CAN_READ
          group_name: ${var.app_access_group}

  apps:
    command_center:
      name: asset-reliability-center
      description: Autonomous and governed asset reliability command center
      permissions:
        - level: CAN_USE
          group_name: ${var.app_access_group}
      # Snapshot only the generated runtime artifact. The bundle root also contains the managed
      # Genie workspace node, which is not a supported Databricks Apps snapshot node type.
      source_code_path: ./.artifacts/app
      forward_user_access_token: true
      user_api_scopes:
        - ai-gateway
        - genie
      resources:
        - name: lakebase
          postgres:
            branch: projects/${resources.postgres_projects.asset_reliability_postgres.project_id}/branches/production
            database: projects/${resources.postgres_projects.asset_reliability_postgres.project_id}/branches/production/databases/databricks-postgres
            permission: CAN_CONNECT_AND_CREATE
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: agent-model-service
          uc_securable:
            securable_type: MODEL_SERVICE
            securable_full_name: ${var.catalog}.${var.schema}.${var.model_service_name}
            permission: EXECUTE
        - name: agent-mlflow-experiment
          experiment:
            experiment_id: ${resources.experiments.agent_observability.id}
            permission: CAN_EDIT
        - name: fleet-telemetry-genie
          genie_space:
            name: fleet-telemetry-genie
            space_id: ${resources.genie_spaces.fleet_telemetry_analyst.id}
            permission: CAN_RUN

targets:
  dev:
    default: true
    mode: development
    workspace:
      host: https://fevm-classic-stable-realtime-demos.cloud.databricks.com
      profile: fe_vm_rtm
