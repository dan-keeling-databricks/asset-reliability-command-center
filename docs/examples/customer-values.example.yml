# Documentation-only worksheet. scripts/deploy.py does not load this file.
# Copy it to an ignored/private location, replace every <placeholder>, and pass the values through
# the checked command-line options in docs/CUSTOMER_DEPLOYMENT.md. Never put secrets in this file.

workspace:
  profile: <customer-cli-profile>
  expected_host: https://<customer-workspace-host>
  bundle_target: <customer-target>

unity_catalog:
  catalog: <existing-catalog>
  schema: <project-schema>
  checkpoint_volume: <managed-checkpoint-volume>
  sql_warehouse_id: <existing-sql-warehouse-id>

app:
  name: <asset-reliability-app-name>
  access_group: <existing-workspace-group>
  # Optional identity assertion for an existing update only. Omit on first install so the
  # installer resolves the service principal created for the target App.
  expected_service_principal_client_id: null
  global_agent_concurrency: 20

lakebase:
  project_id: <lakebase-project-id>
  branch: <lakebase-branch>
  database: <lakebase-database>
  database_resource_name: <lakebase-database-resource-name>
  endpoint_name: <lakebase-endpoint-name>
  operational_schema: <lakebase-operational-schema>

personal_sandboxes:
  source: rate
  sandbox_capacity: 32
  telemetry_samples_per_second: 2
  source_partitions: 4

agent:
  foundation_model: system.ai.<foundation-model-api-model>
  model_service_name: <unity-gateway-model-service-name>
  skill_id: <governed-skill-id>
  mcp_connection_id: <mcp-source-connection-id>
  mcp_service_id: <mcp-service-id>
  policy_function_name: <submit-work-order-policy-function>

observability:
  mlflow_experiment_name: /Shared/<customer-project>-agent
  trace_catalog: <unity-catalog-trace-catalog>
  trace_schema: <unity-catalog-trace-schema>
  trace_table_prefix: <unity-catalog-trace-table-prefix>

# These assets are retained for architecture reference and are not required by the default demo.
# Enabling them is a separate production-integration project, not an installation toggle.
production_reference:
  enabled: false
  bundle_fragment: resources/production_reference.yml
  # Leave these placeholders unresolved while enabled is false. Enabling the fragment requires a
  # separate review and customer-owned connectivity/configuration.
  kafka_bootstrap: <customer-kafka-bootstrap-address>
  kafka_topic: asset-reliability-pump-telemetry
  telemetry_pipeline_node_type: <approved-classic-node-type>
  production_reference_access_group: <existing-history-and-genie-group>
  genie_parent_path: /Shared
